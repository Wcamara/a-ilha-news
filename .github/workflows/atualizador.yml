name: Atualizador A Ilha News

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada hora na nuvem
  workflow_dispatch: # Botão manual para forçar a atualização quando quiser

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Executar o Robô da Lagum
        run: python robo_noticias.py

      - name: Salvar novo index.html (Commit)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Robô A Ilha"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automação: Novidades da Lagum adicionadas" && git push)
